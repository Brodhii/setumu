<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri — Wisata Setumu Dompak</title>
    <link rel="stylesheet" href="css/style.css?v=1.9">
    <link rel="stylesheet" href="css/galeri.css?v=1.9">
    <link rel="stylesheet" href="css/responsive.css?v=1.9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h2>Galeri Pantai Setumu</h2>
        <div class="divider-center"></div>
        <p>Dokumentasi keindahan alam, aktivitas wisata, dan momen terbaik di Pantai Setumu.</p>
    </div>

    <!-- FILTER -->
    <div class="filter-wrap">
        <button class="btn-filter active" data-filter="all">Semua</button>
        <button class="btn-filter" data-filter="pantai">Pantai</button>
        <button class="btn-filter" data-filter="sunset">Sunset</button>
        <button class="btn-filter" data-filter="event">Event</button>
    </div>

    <!-- GALLERY GRID -->
    <div class="gallery-section">
        <div class="gallery-grid" id="galleryGrid">

            <!-- 🏖 PANTAI (Daytime, scenery, structures, and facilities) -->
            <div class="gallery-item" data-category="pantai" data-caption="Suasana Pesisir Pantai Setumu Berbatu">
                <img src="images/galeri3.jpg" alt="Suasana Pesisir Pantai Setumu Berbatu">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="pantai" data-caption="Pondok Kuliner di Area Pantai Setumu">
                <img src="images/galeri4.jpg" alt="Pondok Kuliner di Area Pantai Setumu">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>
            
            <div class="gallery-item" data-category="pantai" data-caption="Pemandangan Udara Pantai Setumu Dompak">
                <img src="images/galeri5.jpg" alt="Pemandangan Udara Pantai Setumu Dompak">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="pantai" data-caption="Barisan Pondok Santai untuk Pengunjung">
                <img src="images/galeri7.jpg" alt="Barisan Pondok Santai untuk Pengunjung">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="pantai" data-caption="Spot Foto Ikonik Wisata Tanjung Setumu">
                <img src="images/galeri8.jpg" alt="Spot Foto Ikonik Wisata Tanjung Setumu">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="pantai" data-caption="Pondok Penginapan dengan Atap Rumbia">
                <img src="images/galeri9.jpg" alt="Pondok Penginapan dengan Atap Rumbia">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="pantai" data-caption="Panggung Live Music dan Area Bermain Pantai">
                <img src="images/galeri13.jpg" alt="Panggung Live Music dan Area Bermain Pantai">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <!-- 🌅 SUNSET (Golden hour, silhouettes, and orange sunset skies) -->
            <div class="gallery-item" data-category="sunset" data-caption="Keindahan Sunset Jingga di Pantai Setumu">
                <img src="images/galeri2.jpg" alt="Keindahan Sunset Jingga di Pantai Setumu">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="sunset" data-caption="Senja di Sela-sela Hutan Mangrove Pantai Setumu">
                <img src="images/galeri6.jpg" alt="Senja di Sela-sela Hutan Mangrove Pantai Setumu">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="sunset" data-caption="Suasana Tenang Sunset di Pesisir Pantai">
                <img src="images/galeri10.jpg" alt="Suasana Tenang Sunset di Pesisir Pantai">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="sunset" data-caption="Matahari Terbenam Jingga yang Spektakuler">
                <img src="images/galeri11.jpg" alt="Matahari Terbenam Jingga yang Spektakuler">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <div class="gallery-item" data-category="sunset" data-caption="Golden Hour Sunset di Bebatuan Pantai Setumu">
                <img src="images/galeri12.jpg" alt="Golden Hour Sunset di Bebatuan Pantai Setumu">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

            <!-- 🎊 EVENT (Performances, stage events, and activities) -->
            <div class="gallery-item" data-category="event" data-caption="Pertunjukan Live Music Terbuka di Pantai Setumu">
                <img src="images/event1.jpg" alt="Pertunjukan Live Music Terbuka di Pantai Setumu">
                <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
            </div>

        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose"><i class="fas fa-times"></i></button>
        <button class="lightbox-prev" id="lightboxPrev"><i class="fas fa-chevron-left"></i></button>
        <div class="lightbox-placeholder" id="lightboxContent">
            <img src="" id="lightboxImg" alt="Pratinjau Foto">
        </div>
        <button class="lightbox-next" id="lightboxNext"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <script src="js/main.js?v=1.9"></script>
    <script>
        // Filter
        const galleryItems = [...document.querySelectorAll('.gallery-item')];
        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                galleryItems.forEach(item => {
                    item.style.display = (filter === 'all' || item.dataset.category === filter) ? 'block' : 'none';
                });
            });
        });

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');
        let currentIndex = 0;

        function getVisible() { return galleryItems.filter(i => i.style.display !== 'none'); }

        function openLightbox(index) {
            const visible = getVisible();
            if (visible.length === 0) return;
            currentIndex = ((index % visible.length) + visible.length) % visible.length;
            const targetItem = visible[currentIndex];
            const imgSrc = targetItem.querySelector('img').src;
            
            lightboxImg.src = imgSrc;
            lightboxCaption.textContent = targetItem.dataset.caption || '';
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        galleryItems.forEach((item) => {
            item.addEventListener('click', () => {
                const visible = getVisible();
                openLightbox(visible.indexOf(item));
            });
        });

        document.getElementById('lightboxClose').onclick = () => {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        };
        document.getElementById('lightboxPrev').onclick = () => openLightbox(currentIndex - 1);
        document.getElementById('lightboxNext').onclick = () => openLightbox(currentIndex + 1);
        lightbox.addEventListener('click', e => {
            if (e.target === lightbox) { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
        });
        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowLeft')  openLightbox(currentIndex - 1);
            if (e.key === 'ArrowRight') openLightbox(currentIndex + 1);
            if (e.key === 'Escape')     { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
        });
    </script>
</body>
</html>
